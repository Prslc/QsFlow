[package]
name = "wayrun-core"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
fasteval = "0.2.4"
gio = "0.22.9"
itertools = "0.15"
nucleo = "0.5.0"
notify = "8.2"
rusqlite = "0.38.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.26.0"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.2"
walkdir = "2.5.0"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
minreq = { version = "3.0.0", default-features = false, features = ["https-native-tls", "json-using-serde", "urlencoding", "proxy"] }
