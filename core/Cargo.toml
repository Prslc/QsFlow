[package]
name = "qsflow-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
dirs = "6.0.0"

meval = "0.2.0"
nucleo = "0.5.0"
reqwest = { version = "0.13.2", features = ["blocking", "form", "json"] }
rusqlite = "0.38.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.26.0"
tokio = { version = "1.50.0", features = ["full"]}
toml = "1.1.2"
uuid = { version = "1.26.0", features = ["v4"] }
walkdir = "2.5.0"
