# WayRun core behaviour. Every key is optional: a missing file or key keeps the
# built-in default shown here. The file is watched, so an edit applies live.

[web_search]
# Suggestion backend: "google" or "duckduckgo".
engine = "google"

[font]
# Primary shaping family, or a generic name (serif, sans-serif, monospace).
# A non-CJK family avoids mapping a CJK font when the UI never draws CJK text.
# Read by the shell at startup, so a change applies on the next launch.
family = "Source Han Sans CN"
