[package]
name = "qsflow-shell"
version = "0.1.0"
edition = "2024"

# One artifact: the shell includes the core and re-runs itself with `--core`.
[[bin]]
name = "qsflow"
path = "src/main.rs"

[dependencies]
qsflow-core = { path = "../core" }
calloop = "0.14"
calloop-wayland-source = "0.4"
cosmic-text = "0.15"
env_logger = "0.11"
log = "0.4"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.11.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
