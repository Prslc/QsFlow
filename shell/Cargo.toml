[package]
name = "qsflow-shell"
version = "0.1.0"
edition = "2024"

# One artifact: the shell includes the core and re-runs itself with `--core`.
[[bin]]
name = "qsflow"
path = "src/main.rs"

[dependencies]
qsflow-core = { path = "../core" }
# The `slint` facade exposes neither the image decoders nor an IME entry point;
# both live in the runtime crate, so the shell takes a direct edge on it. Exact
# pin: the types must be the same crate instance the facade builds against.
i-slint-core = { version = "=1.18.0", features = ["image-decoders", "svg"] }
slint = { version = "1.18.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
] }

anyhow = "1"
bytemuck = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"

[build-dependencies]
slint-build = "1.18.0"
